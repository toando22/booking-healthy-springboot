<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{admin/include/header :: header (title='Bác sĩ Dashboard')}"></th:block>
</head>
<body>

<th:block th:replace="~{admin/include/header :: header-nav}"></th:block>

<th:block th:replace="~{doctor/include/sidebar :: sidebar}"></th:block>

<main id="main" class="main">
    <div class="pagetitle">
        <h1>Tổng quan công việc</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/doctor/dashboard}">Home</a></li>
                <li class="breadcrumb-item active">Dashboard</li>
            </ol>
        </nav>
    </div>

    <section class="section dashboard">
        <div class="row">

            <div class="col-xxl-3 col-md-6">
                <div class="card info-card sales-card">
                    <div class="card-body">
                        <h5 class="card-title">Cần khám hôm nay</h5>
                        <div class="d-flex align-items-center">
                            <div class="card-icon rounded-circle d-flex align-items-center justify-content-center">
                                <i class="bi bi-people"></i>
                            </div>
                            <div class="ps-3">
                                <h6 th:text="${countToday}">0</h6>
                                <span class="text-success small pt-1 fw-bold">bệnh nhân</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xxl-3 col-md-6">
                <div class="card info-card revenue-card">
                    <div class="card-body">
                        <h5 class="card-title">Chờ xác nhận</h5>
                        <div class="d-flex align-items-center">
                            <div class="card-icon rounded-circle d-flex align-items-center justify-content-center">
                                <i class="bi bi-hourglass-split"></i>
                            </div>
                            <div class="ps-3">
                                <h6 th:text="${countPending}">0</h6>
                                <span class="text-muted small pt-2 ps-1">yêu cầu mới</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xxl-3 col-md-6">
                <div class="card info-card customers-card">
                    <div class="card-body">
                        <h5 class="card-title">Đã khám xong</h5>
                        <div class="d-flex align-items-center">
                            <div class="card-icon rounded-circle d-flex align-items-center justify-content-center">
                                <i class="bi bi-check-circle"></i>
                            </div>
                            <div class="ps-3">
                                <h6 th:text="${countCompleted}">0</h6>
                                <span class="text-muted small pt-2 ps-1">ca thành công</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Tỷ lệ Trạng thái Lịch hẹn</h5>
                        <div id="doctorPieChart" style="min-height: 350px;"></div>

                        <script th:inline="javascript">
                            document.addEventListener("DOMContentLoaded", () => {
                                new ApexCharts(document.querySelector("#doctorPieChart"), {
                                    series: [
                                        /*[[${countPending}]]*/ 1,
                                        /*[[${countConfirmed}]]*/ 2,
                                        /*[[${countCompleted}]]*/ 3,
                                        /*[[${countCancelled}]]*/ 1
                                    ],
                                    chart: {
                                        height: 350,
                                        type: 'pie',
                                        toolbar: { show: true }
                                    },
                                    labels: ['Chờ duyệt', 'Đã xác nhận', 'Đã khám', 'Đã hủy'],
                                    colors: ['#ffc107', '#0d6efd', '#198754', '#dc3545']
                                }).render();
                            });
                        </script>
                    </div>
                </div>
            </div>

        </div>
    </section>
</main>

<th:block th:replace="~{admin/include/footer :: footer}"></th:block>

<script th:src="@{/assets-admin/vendor/apexcharts/apexcharts.min.js}"></script>
<script th:src="@{/assets-admin/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets-admin/js/main.js}"></script>

</body>
</html>
